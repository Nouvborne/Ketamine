name: Build IPA

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect and Build Xcode Project
        run: |
          # 1. Détection automatique du fichier projet ou workspace
          if [ -d "*.xcworkspace" ]; then
            FILE_FLAG="-workspace $(ls -d *.xcworkspace | head -n 1)"
          else
            FILE_FLAG="-project $(ls -d *.xcodeproj | head -n 1)"
          fi

          # 2. Détection automatique du premier Scheme disponible
          SCHEME=$(xcodebuild $FILE_FLAG -list | grep -A 10 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
          echo "Scheme détecté : $SCHEME"

          # 3. Compilation sans signature
          xcodebuild clean build \
            $FILE_FLAG \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR=build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r Ketamine.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ketamine-IPA
          path: Ketamine.ipa
